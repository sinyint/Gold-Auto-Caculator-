<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA & Full-Screen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ရွှေတွက်စက်">
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/gold-bars.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#090d16">
    <link rel="manifest" href="manifest.json">

    <title>ရွှေအလေးချိန် Auto တွက်စက်</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; background: #090d16; color: #e2e8f0; overflow: hidden; }
        .main-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 500px; margin: 0 auto; padding: 10px 12px 20px 12px; gap: 8px; }
        .top-controls { flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
        .standard-selector { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid #283548; background: #131c2e; color: #fbbf24; font-size: 13px; font-weight: bold; outline: none; text-align-last: center; text-align: center; }
        .btn-group { display: flex; gap: 8px; }
        .btn-add { flex: 3; padding: 8px 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; box-shadow: 0 3px 6px rgba(245, 158, 11, 0.2); }
        .btn-clear-all { flex: 1; padding: 8px 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; box-shadow: 0 3px 6px rgba(239, 68, 68, 0.2); }
        .middle-controls { flex-shrink: 0; }
        .results-container { display: flex; gap: 8px; }
        .result-card { flex: 1; background: linear-gradient(145deg, #162032, #101726); padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 3px 8px rgba(0,0,0,0.3); text-align: center; }
        .result-card.gold-card { border-left: 4px solid #f59e0b; }
        .result-card.gram-card { border-left: 4px solid #10b981; }
        .result-val { font-size: 13px; color: #fbbf24; font-weight: bold; }
        .gram-val { font-size: 13px; color: #34d399; font-weight: bold; }
        .negative-mode .result-val, .negative-mode .gram-val { color: #f87171 !important; }
        .negative-mode.gold-card, .negative-mode.gram-card { border-left-color: #ef4444 !important; }
        .list-container { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 2px; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }
        .row-item { background: #131c2e; padding: 6px 8px; border-radius: 10px; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; border: 1px solid rgba(255, 255, 255, 0.04); border-left: 4px solid #10b981; box-shadow: 0 2px 5px rgba(0,0,0,0.25); }
        .row-item.minus-mode { border-left-color: #ef4444 !important; background: #231118; }
        .row-number { font-weight: bold; color: #f59e0b; min-width: 26px; font-size: 12px; text-align: right; padding-right: 2px; flex-shrink: 0; }
        input, select { width: 100%; padding: 7px 2px; border-radius: 7px; border: 1px solid #283548; background: #090d16; color: #fff; text-align: center; font-size: 13px; font-weight: bold; outline: none; min-width: 0; -webkit-appearance: none; }
        input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15); }
        .op { font-weight: 900; cursor: pointer; color: #10b981; font-size: 14px; background-color: #090d16; flex-shrink: 0; text-align-last: center; }
        .minus-mode .op { color: #ef4444 !important; background-color: #3b1114; border-color: #ef4444; }
        .btn-del { background: #1e293b; color: #ef4444; border: 1px solid #ef4444; padding: 5px 8px; border-radius: 7px; font-size: 12px; font-weight: bold; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-controls">
            <select class="standard-selector" id="goldStandard" onchange="saveData(); autoCalculate();">
                <option value="128">၁ ကျပ် = ၁၂၈ ရွေး</option>
                <option value="120">၁ ကျပ် = ၁၂၀ ရွေး</option>
            </select>
            <div class="btn-group">
                <button class="btn-add" id="btnAdd" type="button">➕</button>
                <button class="btn-clear-all" id="btnClearAll" type="button">🗑️</button>
            </div>
        </div>
        <div class="middle-controls">
            <div class="results-container">
                <div class="result-card gold-card" id="goldCard"><div class="result-val" id="totalResult">၀ကျပ် ၀ပဲ ၀ရွေး</div></div>
                <div class="result-card gram-card" id="gramCard"><div class="gram-val" id="totalGram">0.000 g</div></div>
            </div>
        </div>
        <div class="list-container" id="itemList"></div>
    </div>
    <script>
        var rowCount = 0;
        window.onload = function() { loadData(); };
        document.getElementById('btnAdd').onclick = function() {
            for (var i = 0; i < 20; i++) { addRow('', '+', '', '', ''); }
            saveData(); autoCalculate();
        };
        document.getElementById('btnClearAll').onclick = function() {
            if (confirm("⚠️ ရေးထားတဲ့ စာရင်းအားလုံးကို ဖျက်ပစ်မှာ သေချာပါသလား?")) {
                document.getElementById('itemList').innerHTML = '';
                rowCount = 0;
                localStorage.removeItem('gold_calculator_data');
                localStorage.removeItem('gold_calculator_standard');
                addRow('', '+', '', '', '');
                autoCalculate();
            }
        };
        function addRow(kVal, opVal, pVal, yVal, customId) {
            rowCount++;
            var rowId = customId ? customId : rowCount;
            var div = document.createElement('div');
            div.className = 'row-item';
            div.id = 'row-' + rowId;
            if (opVal === '-') div.classList.add('minus-mode');

            var numSpan = document.createElement('span');
            numSpan.className = 'row-number';
            numSpan.innerText = rowId + '။';

            var select = document.createElement('select');
            select.className = 'op';
            select.style.width = '44px';
            select.innerHTML = '<option value="+">＋</option><option value="-">－</option>';
            select.value = opVal;
            select.onchange = function() { updateRowStyle(rowId); saveData(); autoCalculate(); };

            var inputK = document.createElement('input');
            inputK.type = 'number'; inputK.className = 'k'; inputK.placeholder = 'ကျပ်'; inputK.value = kVal;
            inputK.onkeydown = function(e) { if(['.', ',', 'e'].includes(e.key)) e.preventDefault(); };
            inputK.oninput = function() { this.value = this.value.replace(/[^0-9]/g, ''); saveData(); autoCalculate(); };
            inputK.onfocus = function() { scrollToRow(div); };

            var inputP = document.createElement('input');
            inputP.type = 'number'; inputP.className = 'p'; inputP.placeholder = 'ပဲ'; inputP.value = pVal;
            inputP.onkeydown = function(e) { if(['.', ',', 'e'].includes(e.key)) e.preventDefault(); };
            inputP.oninput = function() { this.value = this.value.replace(/[^0-9]/g, ''); saveData(); autoCalculate(); };
            inputP.onfocus = function() { scrollToRow(div); };

            var inputY = document.createElement('input');
            inputY.type = 'number'; inputY.className = 'y'; inputY.placeholder = 'ရွေး'; inputY.value = yVal;
            inputY.oninput = function() { saveData(); autoCalculate(); };
            inputY.onfocus = function() { scrollToRow(div); };

            div.appendChild(numSpan); div.appendChild(select); div.appendChild(inputK); div.appendChild(inputP); div.appendChild(inputY);

            var btnDel = document.createElement('button');
            btnDel.type = 'button'; btnDel.className = 'btn-del'; btnDel.innerText = '✕';
            btnDel.onclick = function() { removeRow(rowId); };
            div.appendChild(btnDel);

            document.getElementById('itemList').appendChild(div);
        }
        function scrollToRow(el) { setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300); }
        function updateRowStyle(id) {
            var row = document.getElementById('row-' + id);
            if (row) {
                if (row.querySelector('.op').value === '-') row.classList.add('minus-mode');
                else row.classList.remove('minus-mode');
            }
        }
        function removeRow(id) {
            var el = document.getElementById('row-' + id);
            if (el) { el.remove(); saveData(); autoCalculate(); }
        }
        function saveData() {
            var standard = document.getElementById('goldStandard').value;
            localStorage.setItem('gold_calculator_standard', standard);
            var rows = document.querySelectorAll('.row-item'), data = [];
            rows.forEach(row => {
                data.push({
                    id: row.id.replace('row-', ''),
                    op: row.querySelector('.op').value,
                    k: row.querySelector('.k').value,
                    p: row.querySelector('.p').value,
                    y: row.querySelector('.y').value
                });
            });
            localStorage.setItem('gold_calculator_data', JSON.stringify(data));
        }
        function loadData() {
            var std = localStorage.getItem('gold_calculator_standard');
            if (std) document.getElementById('goldStandard').value = std;
            var saved = localStorage.getItem('gold_calculator_data');
            if (saved) {
                try {
                    var data = JSON.parse(saved);
                    if (data && data.length > 0) {
                        rowCount = 0; document.getElementById('itemList').innerHTML = '';
                        data.forEach(item => {
                            addRow(item.k, item.op, item.p, item.y, item.id);
                            if (parseInt(item.id) > rowCount) rowCount = parseInt(item.id);
                        });
                    } else { addRow('', '+', '', '', ''); }
                } catch(e) { addRow('', '+', '', '', ''); }
            } else {
                for (var i = 0; i < 10; i++) { addRow('', '+', '', '', ''); }
            }
            autoCalculate();
        }
        function autoCalculate() {
            var std = parseInt(document.getElementById('goldStandard').value) || 128;
            var total = 0;
            document.querySelectorAll('.row-item').forEach(row => {
                var k = parseFloat(row.querySelector('.k').value) || 0;
                var p = parseFloat(row.querySelector('.p').value) || 0;
                var y = parseFloat(row.querySelector('.y').value) || 0;
                var cur = (std === 120) ? (k * 120) + (p * 7.5) + y : (k * 128) + (p * 8) + y;
                if (row.querySelector('.op').value === '-') total -= cur;
                else total += cur;
            });
            var isNeg = total < 0, abs = Math.abs(total);
            var fk = 0, fp = 0, fy = 0;
            if (std === 120) {
                fk = Math.floor(abs / 120); var r1 = abs % 120; fp = Math.floor(r1 / 7.5); fy = r1 % 7.5;
            } else {
                fk = Math.floor(abs / 128); var r2 = abs % 128; fp = Math.floor(r2 / 8); fy = r2 % 8;
            }
            var ry = Math.round(fy * 100) / 100;
            var grams = (abs * (16.605 / 128)).toFixed(3);
            var gCard = document.getElementById('goldCard'), grCard = document.getElementById('gramCard');
            if (isNeg) {
                gCard.classList.add('negative-mode'); grCard.classList.add('negative-mode');
                document.getElementById('totalResult').innerText = '-' + fk + 'ကျပ် ' + fp + 'ပဲ ' + ry + 'ရွေး';
                document.getElementById('totalGram').innerText = '-' + grams + ' g';
            } else {
                gCard.classList.remove('negative-mode'); grCard.classList.remove('negative-mode');
                document.getElementById('totalResult').innerText = fk + 'ကျပ် ' + fp + 'ပဲ ' + ry + 'ရွေး';
                document.getElementById('totalGram').innerText = grams + ' g';
            }
        }
    </script>
</body>
</html>
